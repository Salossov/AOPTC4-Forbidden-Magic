plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'forbidden'
version = project.mod_version
base { archivesName = 'ForbiddenMagic-1.21.1' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }

sourceSets {
    rules {
        java.srcDir 'src/main/java'
        java.include '**/ContentGates.java', '**/FoundationRules.java'
    }
    nativeVerification {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    client {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations.nativeVerificationImplementation.extendsFrom configurations.implementation
configurations.nativeVerificationCompileOnly.extendsFrom configurations.compileOnly
configurations.nativeVerificationRuntimeOnly.extendsFrom configurations.runtimeOnly
configurations.clientImplementation.extendsFrom configurations.implementation
configurations.clientCompileOnly.extendsFrom configurations.compileOnly
configurations.clientRuntimeOnly.extendsFrom configurations.runtimeOnly

neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.nativeVerification
    addModdingDependenciesTo sourceSets.client
    mods {
        forbidden {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        client { client(); sourceSet = sourceSets.client; gameDirectory = file('runs/private-client') }
        server { server(); gameDirectory = file('runs/private-server') }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.nativeVerification
            gameDirectory = file('runs/private-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'forbidden'
        }
    }
}

def defaultCoreRoot = file('../../../repo')
if (!file("${defaultCoreRoot}/api").isDirectory()) {
    defaultCoreRoot = file('../../../../../repo')
}
def coreRoot = providers.gradleProperty('coreRoot').isPresent() ? file(providers.gradleProperty('coreRoot').get()) : defaultCoreRoot
def apiJar = file(providers.gradleProperty('thaumcraftApiJar').getOrElse("${coreRoot}/api/build/libs/thaumcraft-api-${project.thaumcraft_version}.jar"))
def defaultCompatRoot = file('../../../../Thaumic_Tinkerer/analysis/compat_reference')
if (!defaultCompatRoot.isDirectory()) {
    defaultCompatRoot = file('../../Thaumic_Tinkerer/analysis/compat_reference')
}
def botaniaJar = file("${defaultCompatRoot}/botania/botania-neoforge-1.21.1-456-20260912.043547-15.jar")
def bloodMagicJar = file("${defaultCompatRoot}/bloodmagic/bloodmagic-3.4.0-46-alpha.jar")
def modopediaJar = file("${defaultCompatRoot}/bloodmagic/modopedia-neoforge-1.21.1-1.1.5.jar")
dependencies {
    compileOnly files(apiJar)
    nativeVerificationRuntimeOnly files(apiJar)
    if (botaniaJar.isFile()) {
        compileOnly files(botaniaJar)
        nativeVerificationCompileOnly files(botaniaJar)
        nativeVerificationRuntimeOnly files(botaniaJar)
    }
    if (bloodMagicJar.isFile()) {
        compileOnly files(bloodMagicJar)
        nativeVerificationCompileOnly files(bloodMagicJar)
        nativeVerificationRuntimeOnly files(bloodMagicJar)
    }
    if (modopediaJar.isFile()) {
        compileOnly files(modopediaJar)
        nativeVerificationCompileOnly files(modopediaJar)
        nativeVerificationRuntimeOnly files(modopediaJar)
    }
    compileOnly "top.theillusivec4.curios:curios-neoforge:${project.curios_version}:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${project.curios_version}"
    runtimeOnly files(providers.gradleProperty('thaumcraftRuntimeJar').getOrElse("${coreRoot}/mod/build/libs/thaumcraft-1.21.1-${project.thaumcraft_version}.jar"))
    // Runtime support for the core is supplied explicitly; never bundle it in this addon.
    if (providers.gradleProperty('aopUiJar').isPresent()) runtimeOnly files(providers.gradleProperty('aopUiJar').get())
}
repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { url = 'https://maven.theillusivec4.top/' } }
        filter { includeGroup 'top.theillusivec4.curios' }
    }
}
tasks.register('verifyApiArtifact') {
    inputs.file(apiJar)
    doLast { if (!apiJar.isFile()) throw new GradleException("Build the pinned Thaumcraft API or pass -PthaumcraftApiJar=<path>: ${apiJar}") }
}
tasks.named('compileJava') { dependsOn 'verifyApiArtifact' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
tasks.withType(Jar).configureEach { from('LICENSE'); from('NOTICE.md') }
tasks.named('jar') { from sourceSets.client.output }
tasks.named('sourcesJar') { from sourceSets.client.allSource }
def artifactVersion = project.version.toString()
tasks.named('processResources') {
    inputs.property('mod_version', artifactVersion)
    filesMatching('META-INF/neoforge.mods.toml') { expand(mod_version: artifactVersion) }
}
tasks.register('foundationRules', JavaExec) {
    dependsOn 'rulesClasses'
    classpath = sourceSets.getByName('rules').runtimeClasspath
    mainClass = 'forbidden.rules.FoundationRules'
}
tasks.register('componentCodecCheck', JavaExec) {
    dependsOn 'nativeVerificationClasses'
    classpath = sourceSets.nativeVerification.runtimeClasspath
    mainClass = 'forbidden.verification.ComponentCodecCheck'
}
tasks.named('check') { dependsOn 'foundationRules', 'componentCodecCheck', 'clientClasses' }
tasks.register('p02ToolsCheck', JavaExec) {
    dependsOn 'nativeVerificationClasses'
    classpath = sourceSets.nativeVerification.runtimeClasspath
    mainClass = 'forbidden.verification.P02ToolsCheck'
}
tasks.register('p02WandCheck', JavaExec) {
    dependsOn 'nativeVerificationClasses'
    classpath = sourceSets.nativeVerification.runtimeClasspath
    mainClass = 'forbidden.verification.P02WandCheck'
}
tasks.register('p03WrathCageCheck', JavaExec) {
    dependsOn 'nativeVerificationClasses'
    classpath = sourceSets.nativeVerification.runtimeClasspath
    mainClass = 'forbidden.verification.P03WrathCageCheck'
}
tasks.register('p03VillagerCheck', JavaExec) {
    dependsOn 'nativeVerificationClasses'
    classpath = sourceSets.nativeVerification.runtimeClasspath
    mainClass = 'forbidden.verification.P03VillagerCheck'
}
tasks.register('p04CompatCheck', JavaExec) {
    dependsOn 'nativeVerificationClasses'
    classpath = sourceSets.nativeVerification.runtimeClasspath
    mainClass = 'forbidden.verification.P04CompatCheck'
}
tasks.register('p04BloodMagicCheck', JavaExec) {
    dependsOn 'nativeVerificationClasses'
    classpath = sourceSets.nativeVerification.runtimeClasspath
    mainClass = 'forbidden.verification.P04BloodMagicCheck'
}
tasks.register('p04BotaniaCheck', JavaExec) {
    dependsOn 'nativeVerificationClasses'
    classpath = sourceSets.nativeVerification.runtimeClasspath
    mainClass = 'forbidden.verification.P04BotaniaCheck'
}
tasks.named('check') { dependsOn 'p02ToolsCheck', 'p02WandCheck', 'p03WrathCageCheck', 'p03VillagerCheck', 'p04CompatCheck', 'p04BloodMagicCheck', 'p04BotaniaCheck' }
['normal': ['false', 'true'], 'noLust': ['true', 'true'], 'noCage': ['false', 'false']].each { profile, flags ->
    tasks.register("p01Content${profile.capitalize()}", JavaExec) {
        dependsOn 'nativeVerificationClasses'
        classpath = sourceSets.nativeVerification.runtimeClasspath
        mainClass = 'forbidden.verification.P01ContentCheck'
        args flags
    }
    tasks.named('check') { dependsOn "p01Content${profile.capitalize()}" }
}
